<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running time</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div id="counter">00:00:00,00</div>
    </header>

    <main>
        <div id="buttons">
            <button type="button" id="play">Play</button>
            <button type="button" id="stop" hidden>Stop</button>
            <button type="button" id="round" disabled>Round</button>
            <button type="reset" id="reset" hidden>Reset</button>
        </div>
    </main>

    <footer id="times"></footer>
</body>
</html>
